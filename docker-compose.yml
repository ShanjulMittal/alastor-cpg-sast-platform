name: cpg-sast-platform

# ---------------------------------------------------------------------------
# Enterprise Deterministic CPG & SAST Platform
#
#   docker compose up -d                 -> Neo4j 5 Community + APOC only
#   docker compose --profile full up -d  -> Neo4j + containerised FastAPI backend
#
# The backend can also run natively (uvicorn) against the containerised Neo4j,
# which is how verify_harness.py drives the platform by default.
# ---------------------------------------------------------------------------

services:
  neo4j:
    image: neo4j:5.26-community
    container_name: cpg-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-cpgsast-password}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_apoc_export_file_enabled: "false"
      NEO4J_apoc_import_file_enabled: "false"
      # --- Memory tuning (CPG ingestion is write-heavy, rule queries are traversal-heavy)
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
      NEO4J_db_memory_transaction_total_max: "1536M"
      NEO4J_db_transaction_timeout: "300s"
      NEO4J_server_jvm_additional: "-XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"
      NEO4J_dbms_usage__report_enabled: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_USER:-neo4j} -p $${NEO4J_PASSWORD:-cpgsast-password} 'RETURN apoc.version();' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpg-backend
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      NEO4J_URI: "${NEO4J_URI:-bolt://neo4j:7687}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-cpgsast-password}"
      CPG_SCAN_BASE: "/workspace"
      CPG_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
    volumes:
      # Mount the repository root read-only so relative scan paths such as
      # "synthetic_test_target" resolve inside the container.
      - ./:/workspace:ro

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
